    :root {

      --accent-purple: #a855f7;

      background-color: var(--navy-dark);
      color: white;

      background: linear-gradient(135deg, #00d4ff 0%, #a855f7 100%);

    .glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);

    }

    .text-accent {
      color: var(--accent);
    }

    h1, h2 { font-weight: bold; line-height: 1.2; }

    .certificate {
      background: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
      border: 8px solid #8B4513;
      border-radius: 20px;
      padding: 60px 80px;
      text-align: center;
      color: #333;
      font-family: 'Georgia', serif;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 800px;
      margin: 40px auto;
    }

    .certificate h1 {
      font-size: 48px;
      color: #8B4513;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .certificate .line {
      border-bottom: 3px solid #8B4513;
      margin: 20px 0;
    }

    .certificate-text {
      font-size: 20px;
      margin: 30px 0;
      font-style: italic;
    }

    .certificate-name {
      font-size: 36px;
      font-weight: bold;
      color: #8B4513;
      margin: 20px 0;
      border-bottom: 2px solid #8B4513;
      padding-bottom: 10px;
    }

    .review-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 10px;
      padding: 20px;
    }

    .stars {
      color: #ffd700;
      font-size: 18px;
    }
  </style>

    function CertificateGenerator() {
      const [studentName, setStudentName] = useState('');
      const [email, setEmail] = useState('');
      const [course, setCourse] = useState('Digital Marketing Mastery');

        e.preventDefault();
        if (studentName && email) {
          const id = 'CERT-' + Math.random().toString(36).substr(2, 9).toUpperCase();
          setCertificateId(id);
          setShowCertificate(true);
        }

      const handlePrint = () => {
        window.print();
      };

      return (
        <section className="py-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">

            </h2>
            <p className="text-gray-400 text-lg max-w-2xl mx-auto">
              Create professional certificates for your digital marketing course completions.
            </p>
          </div>

          {!showCertificate ? (
            <div className="glass rounded-lg p-8 border border-accent/20 max-w-2xl mx-auto">
              <form onSubmit={handleGenerateCertificate} className="space-y-6">
                <div>
                  <label className="block text-sm font-medium mb-2">Student Name *</label>
                  <input
                    type="text"
                    value={studentName}
                    onChange={(e) => setStudentName(e.target.value)}
                    className="w-full bg-navy-light border border-accent/20 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:border-accent focus:outline-none transition"
                    placeholder="John Doe"
                    required
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium mb-2">Email Address *</label>
                  <input
                    type="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className="w-full bg-navy-light border border-accent/20 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:border-accent focus:outline-none transition"
                    placeholder="john@example.com"
                    required
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium mb-2">Course Name</label>
                  <select
                    value={course}
                    onChange={(e) => setCourse(e.target.value)}
                    className="w-full bg-navy-light border border-accent/20 rounded-lg px-4 py-3 text-white focus:border-accent focus:outline-none transition"
                  >
                    <option>Basic Digital Marketing (3 Months)</option>
                    <option>Advanced Digital Marketing (6 Months)</option>
                    <option>Professional Digital Marketing (1 Year)</option>
                    <option>SEO Certification</option>
                    <option>Content Marketing Pro</option>
                    <option>Social Media Marketing</option>
                    <option>Email Marketing Expert</option>
                    <option>Paid Ads Certification</option>
                    <option>Analytics & Data Mastery</option>
                  </select>
                </div>

                <div>
                  <label className="block text-sm font-medium mb-2">Completion Date</label>
                  <input
                    type="date"
                    value={completionDate}
                    onChange={(e) => setCompletionDate(e.target.value)}
                    className="w-full bg-navy-light border border-accent/20 rounded-lg px-4 py-3 text-white focus:border-accent focus:outline-none transition"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full gradient-accent text-navy-900 font-bold py-3 rounded-lg hover:opacity-90 transition"
                >
                  Generate Certificate
                </button>
              </form>
            </div>
          ) : (
            <div>
              <div className="certificate">
                <h1>Certificate of Completion</h1>
                <div className="line"></div>

                <p className="certificate-text">This certifies that</p>

                <div className="certificate-name">{studentName}</div>

                <p className="certificate-text">has successfully completed the course</p>

                <p style={{fontSize: '28px', color: '#8B4513', margin: '20px 0', fontWeight: 'bold'}}>
                  {course}
                </p>

                <p className="certificate-text">on {new Date(completionDate).toLocaleDateString('en-US', {year: 'numeric', month: 'long', day: 'numeric'})}</p>

                <div className="line" style={{marginTop: '40px'}}></div>

                <p style={{fontSize: '12px', color: '#666', marginTop: '20px'}}>
                  Certificate ID: {certificateId}
                </p>
              </div>

              <div className="flex gap-4 justify-center mt-8">
                <button
                  onClick={handlePrint}
                  className="px-8 py-3 rounded-lg gradient-accent text-navy-900 font-semibold hover:opacity-90 transition"
                >
                  🖨️ Print Certificate
                </button>
                <button
                  onClick={() => {
                    setShowCertificate(false);
                    setStudentName('');
                    setEmail('');
                  }}
                  className="px-8 py-3 rounded-lg border border-accent text-accent hover:bg-accent/10 transition"
                >
